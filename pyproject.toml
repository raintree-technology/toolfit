[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raintree-toolfit"
version = "0.2.0"
description = "Find tools and agent capabilities that fit your work, without uploading project data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raintree Technology" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.scripts]
toolfit = "toolfit:main"
ate-scan = "toolfit:main"

[project.urls]
Homepage = "https://github.com/admin-raintree/toolfit"
Issues = "https://github.com/admin-raintree/toolfit/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolfit = ["capabilities.jsonl"]
